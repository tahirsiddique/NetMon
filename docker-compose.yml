version: '3.8'

services:
  # PostgreSQL Database with TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg14
    container_name: netmon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-digiskills_monitor}
      POSTGRES_USER: ${DB_USER:-monitor_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecurePassword123!}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-monitor_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - netmon-network

  # Redis for caching and session storage
  redis:
    image: redis:7-alpine
    container_name: netmon-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispass}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - netmon-network

  # Backend API - Instance 1
  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netmon-backend-1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-digiskills_monitor}
      DB_USER: ${DB_USER:-monitor_user}
      DB_PASSWORD: ${DB_PASSWORD:-SecurePassword123!}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispass}
      SMTP_HOST: ${SMTP_HOST:-smtp.digiskills.local}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-monitor@digiskills.local}
      SMTP_PASS: ${SMTP_PASS:-EmailPassword}
      SMTP_FROM: ${SMTP_FROM:-monitor@digiskills.local}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@digiskills.local}
      ALERT_EVAL_INTERVAL: ${ALERT_EVAL_INTERVAL:-60000}
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - netmon-network

  # Backend API - Instance 2 (for load balancing)
  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netmon-backend-2
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-digiskills_monitor}
      DB_USER: ${DB_USER:-monitor_user}
      DB_PASSWORD: ${DB_PASSWORD:-SecurePassword123!}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispass}
      SMTP_HOST: ${SMTP_HOST:-smtp.digiskills.local}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-monitor@digiskills.local}
      SMTP_PASS: ${SMTP_PASS:-EmailPassword}
      SMTP_FROM: ${SMTP_FROM:-monitor@digiskills.local}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@digiskills.local}
      ALERT_EVAL_INTERVAL: ${ALERT_EVAL_INTERVAL:-60000}
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - netmon-network

  # Alert Worker
  alert-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netmon-alert-worker
    restart: unless-stopped
    command: ["node", "src/workers/alert-worker.js"]
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-digiskills_monitor}
      DB_USER: ${DB_USER:-monitor_user}
      DB_PASSWORD: ${DB_PASSWORD:-SecurePassword123!}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispass}
      SMTP_HOST: ${SMTP_HOST:-smtp.digiskills.local}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-monitor@digiskills.local}
      SMTP_PASS: ${SMTP_PASS:-EmailPassword}
      SMTP_FROM: ${SMTP_FROM:-monitor@digiskills.local}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@digiskills.local}
      ALERT_EVAL_INTERVAL: ${ALERT_EVAL_INTERVAL:-60000}
    volumes:
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-1:
        condition: service_healthy
    networks:
      - netmon-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netmon-frontend
    restart: unless-stopped
    depends_on:
      - backend-1
      - backend-2
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - netmon-network

  # Nginx Load Balancer & Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: netmon-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend-1
      - backend-2
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - netmon-network

  # Automated Backup Service
  backup:
    image: postgres:15-alpine
    container_name: netmon-backup
    restart: "no"
    profiles:
      - backup
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${DB_NAME:-digiskills_monitor}
      PGUSER: ${DB_USER:-monitor_user}
      PGPASSWORD: ${DB_PASSWORD:-SecurePassword123!}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - netmon-network
    entrypoint: ["/scripts/backup.sh"]

networks:
  netmon-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  backend_uploads:
    driver: local
  nginx_logs:
    driver: local
